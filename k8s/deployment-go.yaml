apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-go
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app-go
  template:
    metadata:
      labels:
        app: demo-app-go
      annotations:
        # Tells the otel-operator webhook to inject the Go auto-instrumentation
        # sidecar for this pod, using the Instrumentation CR named "demo-instrumentation-go"
        instrumentation.opentelemetry.io/inject-go: "demo-instrumentation-go"
        # Required for Go: the operator needs to know which container holds the binary
        instrumentation.opentelemetry.io/otel-go-instrumentation-container: demo-app-go
        # Exclude the Postgres port so Envoy doesn't intercept outbound connections to it.
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
    spec:
      containers:
        - name: demo-app-go
          image: ghcr.io/tom-ludwig/otel-kyma-instrumentation-evaluation:0.0.2-golang
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PG_HOST
              value: postgres-go
            - name: PG_USER
              value: postgres
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-go-secret
                  key: password
          # Go auto-instrumentation uses eBPF (no code change),
          # but the sidecar still needs these privileges
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-go
  namespace: demo
spec:
  selector:
    app: demo-app-go
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-go-secret
  namespace: demo
type: Opaque
stringData:
  password: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-go
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-go
  template:
    metadata:
      labels:
        app: postgres-go
      annotations:
        # Exclude the Postgres port so Envoy doesn't intercept it; Istio cannot handle the Postgres wire protocol.
        traffic.sidecar.istio.io/excludeInboundPorts: "5432"
    spec:
      containers:
        - name: postgres-go
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-go-secret
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-go
  namespace: demo
spec:
  selector:
    app: postgres-go
  ports:
    # Port name prefix "tcp-" tells Istio this is a plain TCP (non-HTTP) port,
    # so it skips HTTP protocol detection on the Postgres connection.
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: demo-instrumentation-go
  namespace: demo
spec:
  exporter:
    # Go auto-instrumentation uses otlp/http-protobuf by default, so 4318 (HTTP) is required; not 4317 (gRPC)
    endpoint: http://telemetry-otlp-traces.kyma-system.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  go:
    env:
      - name: OTEL_GO_AUTO_TARGET_EXE
        value: /demo-app
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-app-go
  namespace: demo
spec:
  parentRefs:
    - name: demo-gateway
      namespace: istio-system
  hostnames:
    - "demo-go.local"
  rules:
    - backendRefs:
        - name: demo-app-go
          port: 8080
