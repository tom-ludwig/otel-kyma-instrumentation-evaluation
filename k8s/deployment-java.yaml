apiVersion: v1
kind: Secret
metadata:
  name: postgres-java-secret
  namespace: demo
type: Opaque
stringData:
  password: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-java
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-java
  template:
    metadata:
      labels:
        app: postgres-java
      annotations:
        # Postgres is a server-first protocol; skip Istio interception on this port
        traffic.sidecar.istio.io/excludeInboundPorts: "5432"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-java-secret
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-java
  namespace: demo
spec:
  selector:
    app: postgres-java
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: demo-instrumentation-java
  namespace: demo
spec:
  exporter:
    endpoint: http://telemetry-otlp-traces.kyma-system.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  java:
    env:
      # The Java agent enables metrics and logs exporters by default; disable them
      # since Kyma's telemetry-otlp-traces only accepts /v1/traces (not /v1/metrics or /v1/logs).
      - name: OTEL_METRICS_EXPORTER
        value: none
      - name: OTEL_LOGS_EXPORTER
        value: none
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-java
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app-java
  template:
    metadata:
      labels:
        app: demo-app-java
      annotations:
        instrumentation.opentelemetry.io/inject-java: "demo-instrumentation-java"
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
    spec:
      containers:
        - name: demo-app-java
          image: ghcr.io/tom-ludwig/otel-kyma-instrumentation-evaluation:0.0.1-java
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PG_HOST
              value: postgres-java
            - name: PG_USER
              value: postgres
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-java-secret
                  key: password
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-java
  namespace: demo
spec:
  selector:
    app: demo-app-java
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: demo-java-gateway
  namespace: demo
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "demo-java.local"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: demo-app-java
  namespace: demo
spec:
  hosts:
    - "demo-java.local"
  gateways:
    - demo-java-gateway
  http:
    - route:
        - destination:
            host: demo-app-java
            port:
              number: 8080
