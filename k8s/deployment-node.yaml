apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-node
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app-node
  template:
    metadata:
      labels:
        app: demo-app-node
      annotations:
        # Tells the otel-operator webhook to inject the Node.js auto-instrumentation init-container
        instrumentation.opentelemetry.io/inject-nodejs: "demo-instrumentation-node"
    spec:
      containers:
        - name: demo-app-node
          image: ghcr.io/tom-ludwig/otel-kyma-instrumentation-evaluation:0.0.2-node
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PG_HOST
              value: postgres
            - name: PG_USER
              value: postgres
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-node
  namespace: demo
spec:
  selector:
    app: demo-app-node
  ports:
    - port: 8080
      targetPort: 8080
---
# Minimal Postgres for the DB span — not meant for production use
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: demo
type: Opaque
stringData:
  password: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        # Postgres is a "server-first" protocol: the server sends the greeting before
        # the client speaks. Istio's protocol sniffing assumes client-first, which resets
        # the connection (ECONNRESET). Exclude the port so Envoy doesn't intercept it.
        traffic.sidecar.istio.io/excludeInboundPorts: "5432"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: demo
spec:
  selector:
    app: postgres
  ports:
    # Port name prefix "tcp-" tells Istio this is a plain TCP (non-HTTP) port,
    # so it skips HTTP protocol detection on the Postgres connection.
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: demo-instrumentation-node
  namespace: demo
spec:
  exporter:
    endpoint: http://telemetry-otlp-traces.kyma-system.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  nodejs: {}
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: demo-node-gateway
  namespace: demo
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "demo-node.local"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: demo-app-node
  namespace: demo
spec:
  hosts:
    - "demo-node.local"
  gateways:
    - demo-node-gateway
  http:
    - route:
        - destination:
            host: demo-app-node
            port:
              number: 8080
