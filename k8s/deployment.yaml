apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        # Tells the otel-operator webhook to inject the Go auto-instrumentation
        # sidecar for this pod, using the Instrumentation CR named "demo-instrumentation"
        instrumentation.opentelemetry.io/inject-go: "demo-instrumentation"
        # Required for Go: the operator needs to know which container holds the binary
        instrumentation.opentelemetry.io/otel-go-instrumentation-container: demo-app
    spec:
      containers:
        - name: demo-app
          image: tom-ludwig/instrumentation-test:0.0.0-1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Go auto-instrumentation uses eBPF (no code change),
          # but the sidecar still needs these privileges
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo
spec:
  selector:
    app: demo-app
  ports:
    - port: 8080
      targetPort: 8080
