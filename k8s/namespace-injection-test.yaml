---
# Namespace with injection annotation: all pods here get auto-instrumented
# without needing per-pod annotations.
# The annotation value "true" picks up the Instrumentation CR named
# "default" in this namespace (or the only CR if there is exactly one).
# To target a specific CR: "ns-inject-test/demo-instrumentation-ns"
apiVersion: v1
kind: Namespace
metadata:
  name: ns-inject-test
  labels:
    istio-injection: enabled
  annotations:
    instrumentation.opentelemetry.io/inject-java: "true"
---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: default
  namespace: ns-inject-test
spec:
  exporter:
    endpoint: http://telemetry-otlp-traces.kyma-system.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  java:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    env:
      - name: OTEL_METRICS_EXPORTER
        value: none
      - name: OTEL_LOGS_EXPORTER
        value: none
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-ns-test-secret
  namespace: ns-inject-test
type: Opaque
stringData:
  password: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-ns-test
  namespace: ns-inject-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-ns-test
  template:
    metadata:
      labels:
        app: postgres-ns-test
      annotations:
        traffic.sidecar.istio.io/excludeInboundPorts: "5432"
        # Opt out of namespace-level injection for Postgres: it doesn't need tracing
        # instrumentation.opentelemetry.io/inject-java: "false"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-ns-test-secret
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-ns-test
  namespace: ns-inject-test
spec:
  selector:
    app: postgres-ns-test
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
---
# No injection annotations on the pod: it inherits from the namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-ns-test
  namespace: ns-inject-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app-ns-test
  template:
    metadata:
      labels:
        app: demo-app-ns-test
      annotations:
        # traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
    spec:
      containers:
        - name: demo-app-ns-test
          image: ghcr.io/tom-ludwig/otel-kyma-instrumentation-evaluation:0.0.1-java
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PG_HOST
              value: postgres-ns-test
            - name: PG_USER
              value: postgres
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-ns-test-secret
                  key: password
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # limits:
            #   cpu: 500m
            #   memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-ns-test
  namespace: ns-inject-test
spec:
  selector:
    app: demo-app-ns-test
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-app-ns-test
  namespace: ns-inject-test
spec:
  parentRefs:
    - name: demo-gateway
      namespace: istio-system
  hostnames:
    - "demo-ns-test.local"
  rules:
    - backendRefs:
        - name: demo-app-ns-test
          port: 8080
